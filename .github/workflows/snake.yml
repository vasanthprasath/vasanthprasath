# ══════════════════════════════════════════════════════════════
#  Contribution Snake Animation
#  Place in: vasanthprasath/vasanthprasath/.github/workflows/snake.yml
#  Runs daily, publishes SVGs to the `output` branch
# ══════════════════════════════════════════════════════════════
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vasanthprasath
          outputs: |
            dist/github-snake.svg?color_snake=#8B5CF6&color_dots=#EDE9FE,#C4B5FD,#A78BFA,#8B5CF6,#6D28D9
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A855F7&color_dots=#161B22,#4C1D95,#6D28D9,#8B5CF6,#C084FC

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
